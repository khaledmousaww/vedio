<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مِرفاق - الأذكار</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="azkar.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-right"><img src="favicon.jpg" alt="Mirfaq Logo" class="logo" /><span class="site-name">مِرفاق</span></div>
    <div class="nav-left"><a href="index.html">الرئيسية</a><a href="azkar.html">الأذكار</a></div>
  </nav>

  <section class="azkar-search">
    <h2>ابحث عن ذكر معين</h2>
    <input type="text" id="search-input" placeholder="اكتب كلمة للبحث..." />
    <label for="filter-select">فلتر حسب النوع:</label>
    <select id="filter-select">
      <option value="all">الكل</option>
      <option value="after-prayer">أذكار بعد الصلاة</option>
      <option value="morning">أذكار الصباح</option>
      <option value="evening">أذكار المساء</option>
      <option value="tasbeeh">التسبيح والاستغفار</option>
    </select>
  </section>

  <section class="azkar-list" id="search-results">
    <div class="azkar-item" data-type="after-prayer" data-count="3">أستغفر الله - 3 مرات</div>
    <div class="azkar-item" data-type="morning" data-count="1">أصبحنا وأصبح الملك لله.</div>
    <div class="azkar-item" data-type="evening" data-count="1">أمسينا وأمسى الملك لله.</div>
    <div class="azkar-item" data-type="tasbeeh" data-count="100">سبحان الله وبحمده.</div>
  </section>

  <footer class="site-footer">
    <div><p>جميع الحقوق محفوظة لدى الخالد تك 2026</p><p>تم تطوير هذا التطبيق بواسطة خالد عبدالعليم</p></div>
  </footer>

  <script>
    const searchInput = document.getElementById('search-input');
    const filterSelect = document.getElementById('filter-select');
    const items = Array.from(document.querySelectorAll('.azkar-item'));

    function applyFilter() {
      const q = searchInput.value.trim();
      const type = filterSelect.value;
      items.forEach((item) => {
        const matchesText = item.innerText.includes(q);
        const matchesType = type === 'all' || item.dataset.type === type;
        item.style.display = matchesText && matchesType ? 'block' : 'none';
      });
    }

    searchInput.addEventListener('input', applyFilter);
    filterSelect.addEventListener('change', applyFilter);
  </script>
</body>
</html>
